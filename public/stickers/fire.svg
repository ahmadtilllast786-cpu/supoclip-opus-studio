<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fireGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFDD00"/>
    </linearGradient>
    <linearGradient id="fireGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FFFF55"/>
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#fireGlow)">
    <!-- Outer Flame -->
    <path d="M60,10 C68,32 88,42 88,68 C88,88 74,106 58,108 C38,110 24,92 24,72 C24,46 44,38 52,18 C54,14 58,6 60,10 Z" fill="url(#fireGrad1)">
      <animateTransform attributeName="transform" type="scale" values="1,1; 1.05,0.96; 0.97,1.04; 1,1" dur="0.8s" repeatCount="indefinite" transform-origin="60 100"/>
    </path>
    <!-- Mid Core Flame -->
    <path d="M60,35 C65,48 76,55 76,74 C76,87 67,98 56,99 C44,100 36,88 36,75 C36,58 50,52 55,38 Z" fill="url(#fireGrad2)">
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.94,1.06; 1.06,0.95; 1,1" dur="0.6s" repeatCount="indefinite" transform-origin="56 95"/>
    </path>
    <!-- Inner Spark -->
    <path d="M58,58 C62,66 68,72 68,82 C68,90 62,95 56,95 C49,95 45,89 45,82 C45,72 53,68 56,60 Z" fill="#FFFFFF">
      <animate attributeName="opacity" values="0.9;0.4;1;0.9" dur="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
