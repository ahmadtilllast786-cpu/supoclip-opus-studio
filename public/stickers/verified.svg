<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="verifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#badgeGlow)">
    <animateTransform attributeName="transform" type="scale" values="1; 1.08; 1" dur="0.9s" repeatCount="indefinite" transform-origin="60 60"/>
    <!-- 12-point scalloped star badge -->
    <path d="M60,16 L68,24 L79,22 L84,32 L95,35 L96,46 L105,53 L101,64 L107,73 L99,81 L101,92 L90,96 L87,107 L76,106 L70,115 L60,110 L50,115 L44,106 L33,107 L30,96 L19,92 L21,81 L13,73 L19,64 L15,53 L24,46 L25,35 L36,32 L41,22 L52,24 Z" fill="url(#verifiedGrad)" stroke="#000000" stroke-width="4"/>
    <!-- White Checkmark -->
    <polyline points="42,62 54,76 80,48" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
