<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF2D55" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#heartGlow)">
    <animateTransform attributeName="transform" type="scale" values="1; 1.18; 1; 1.12; 1" dur="0.9s" repeatCount="indefinite" transform-origin="60 60"/>
    <!-- Heart Shape -->
    <path d="M60,102 C42,88 18,68 18,44 C18,26 32,16 46,16 C54,16 60,22 60,22 C60,22 66,16 74,16 C88,16 102,26 102,44 C102,68 78,88 60,102 Z" fill="url(#heartGrad)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Glossy Highlight -->
    <ellipse cx="40" cy="34" rx="8" ry="5" transform="rotate(-30 40 34)" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
