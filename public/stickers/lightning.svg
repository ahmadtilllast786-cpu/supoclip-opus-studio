<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFDD00" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#boltGlow)">
    <polygon points="68,6 26,62 58,62 48,114 96,52 64,52" fill="url(#boltGrad)" stroke="#000000" stroke-width="4.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="scale" values="1; 1.1; 0.96; 1.05; 1" dur="0.4s" repeatCount="indefinite" transform-origin="60 60"/>
    </polygon>
  </g>
